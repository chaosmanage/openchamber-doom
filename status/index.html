<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>DOOM · OpenChamber</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="doom" id="root">
    <section id="lobby" class="lobby">
      <button id="launch" class="tile" type="button" aria-label="Launch Doom">
        <span class="tile-head"><span class="tile-name">DOOM</span><span class="tile-tag">1993 · WASM</span></span>
        <svg class="tile-art" viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pixelated retro corridor">
          <rect width="320" height="110" fill="#14151a"/>
          <path d="M0 0L90 38H230L320 0Z" fill="#27252a"/>
          <path d="M0 110L90 72H230L320 110Z" fill="#292a2f"/>
          <path d="M0 0L90 38V72L0 110Z" fill="#444145"/>
          <path d="M320 0L230 38V72L320 110Z" fill="#3c3b3f"/>
          <rect x="90" y="38" width="140" height="34" fill="#1e2623"/>
          <rect x="132" y="36" width="56" height="36" fill="#45544b"/>
          <rect x="142" y="46" width="36" height="26" fill="#171d1b"/>
          <path d="M156 56h8m-4-4v8" stroke="#d0cfaf" stroke-width="1.2"/>
          <path d="M158 110V85L149 77V110ZM171 110V85L162 77V110Z" fill="#55545a" opacity=".9"/>
          <path d="M3 82h35m245 0h34M2 94h19m280 0h18" stroke="#75706b" stroke-width="4"/>
        </svg>
        <span class="tile-foot"><span>Silent · no GPU · loads only on play</span><span class="tile-go">Play</span></span>
      </button>
      <p class="caption">No background work. Engine unloads when you leave the section.</p>
    </section>

    <section id="play" class="play" hidden>
      <header class="play-bar">
        <button id="exit" class="bar-button" type="button" aria-label="Exit Doom">‹ <span>Back</span></button>
        <strong class="play-title">DOOM</strong>
        <span id="meter" class="meter" aria-label="Measured engine processing per tick">— ms/tick</span>
        <button id="restart" class="icon-button" type="button" aria-label="Restart Doom" title="Restart">↻</button>
      </header>
      <div id="game-frame" class="game-frame">
        <canvas id="screen" width="320" height="200" tabindex="0" aria-label="DOOM game. Click to focus, WASD to move, Control to shoot."></canvas>
        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <p id="overlay-kicker" class="kicker"></p>
            <p id="overlay-title" class="overlay-title"></p>
            <p id="overlay-message" class="overlay-message"></p>
            <button id="overlay-button" type="button" class="primary">Resume</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <label class="mode-label" for="mode">CPU mode</label>
        <select id="mode" title="Lower speeds run the entire game more slowly to save CPU">
          <option value="10">Eco · 10 tps</option>
          <option value="15" selected>Low · 15 tps</option>
          <option value="25">Balanced · 25 tps</option>
          <option value="35">Original · 35 tps</option>
        </select>
        <button id="pause" class="bar-button" type="button">Pause</button>
      </div>
      <p class="caption" id="hint">Click the game · WASD / arrows move · Ctrl or F fires · Space or E opens · Shift runs · Esc menu</p>
      <div class="touch-keys" aria-label="Touch controls">
        <div class="dpad">
          <button data-key="ArrowLeft" type="button" aria-label="Turn left">◀</button>
          <button data-key="ArrowUp" type="button" aria-label="Forward">▲</button>
          <button data-key="ArrowDown" type="button" aria-label="Back">▼</button>
          <button data-key="ArrowRight" type="button" aria-label="Turn right">▶</button>
        </div>
        <button data-key="Control" type="button">Fire</button>
        <button data-key=" " type="button">Use</button>
      </div>
    </section>
  </main>
  <script src="./main.js"></script>
</body>
</html>
